amcl:
  ros__parameters:
    use_sim_time: True
    # AMCL tuning note, 2026-06-23:
    # RPP v2 fixed the initial no-motion failure, but long-distance purple-box
    # runs still diverged between AMCL and raw odom. Increase scan update
    # density and particle coverage, trust simulator odometry slightly more
    # than the TurtleBot-style default noise values, and disable beam skipping
    # for v2 because the v1 run still reached 5.604 m AMCL/odom disagreement.
    # Node8 scan-accumulator v2 later reduced AMCL transform_tolerance from
    # 2.0 s to 0.2 s after Nav2 restart showed map->base_link lookups stuck
    # behind future-dated map->odom transforms.
    # Source: https://docs.nav2.org/configuration/packages/configuring-amcl.html
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    # Node8 AMCL odom-dominant test, 2026-06-24:
    # The reboot AMCL run still drifted from raw odom by 4.20 m while the
    # odom-truth baseline reached the same target. The projected warehouse scan
    # contains shelf/forklift/near-wall structure that is not reliably encoded in
    # the static occupancy map, so the likelihood-field correction can pull the
    # particle cloud toward a wrong corridor match. The 2026-06-24 conservative
    # test kept AMCL/raw disagreement under 0.5 m for the first ~380 s, then
    # diverged to 5.31 m in the shelf/corridor region while raw odom remained
    # 6.70 m from the target and Nav2 feedback claimed 5.03 m remaining. For
    # this pass, make AMCL odom-dominant: keep scan corrections available, but
    # make individual scan matches much less able to overpower Isaac odometry.
    # Source: https://docs.nav2.org/configuration/packages/configuring-amcl.html
    laser_likelihood_max_dist: 0.75
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 80
    max_particles: 4000
    min_particles: 1000
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.50
    # Node8 odom-truth baseline: Isaac raw odom is aligned with map after reset
    # and is more physically faithful than the current AMCL scan match. Disable
    # AMCL's map->odom broadcast so a static/sim-truth map->odom transform can
    # be used for controller/costmap isolation tests.
    # Source: https://docs.nav2.org/configuration/packages/configuring-amcl.html
    tf_broadcast: true
    transform_tolerance: 0.2
    # Node8 v6: avoid excessive AMCL corrections during near-pure rotation
    # and during shelf/corridor scan-map mismatch.
    # The v4 clean reset run with RPP rotate-to-heading produced almost no raw
    # odom translation while AMCL drifted by >1 m. Keep scan updates frequent
    # enough for long corridors, but less eager during tiny angular changes.
    update_min_a: 0.25
    update_min_d: 0.20
    z_hit: 0.15
    z_max: 0.05
    z_rand: 0.75
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    # Isaac Sim publishes Odometry on /chassis/odom with frame_id=odom and
    # child_frame_id=base_link. Keep TF frame names unchanged, but point Nav2
    # nodes that consume an odom topic at the actual Isaac topic.
    # Source: https://docs.nav2.org/configuration/packages/configuring-bt-navigator.html
    odom_topic: /chassis/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 20.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 3.14
    # Controller tuning note, 2026-06-23:
    # Long-distance shelf/package navigation was failing with DWB after AMCL/odom
    # disagreement grew during extended runs. Switch to Nav2 Regulated Pure
    # Pursuit for smoother path tracking and obstacle-aware speed regulation.
    # Sources:
    # - Nav2 RPP docs: https://docs.nav2.org/configuration/packages/configuring-regulated-pp.html
    # - Nav2 RPP plugin: https://github.com/ros-navigation/navigation2/tree/main/nav2_regulated_pure_pursuit_controller
    # - Macenski et al., 2023: https://arxiv.org/abs/2305.20026
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.32
      lookahead_dist: 1.0
      min_lookahead_dist: 0.3
      max_lookahead_dist: 1.4
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.9
      transform_tolerance: 2.0
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.12
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      # Disabled again after the Node8 v4 clean reset run: Carter received
      # sustained pure-rotation commands (linear.x=0, angular.z=0.125), raw odom
      # stayed near the origin, and AMCL drifted by >1 m. For this Isaac setup,
      # long-route validation is safer with continuous forward progress and
      # AMCL updates gated less aggressively during small rotations.
      # Source: https://docs.nav2.org/configuration/packages/configuring-regulated-pp.html
      use_rotate_to_heading: false
      allow_reversing: false
      rotate_to_heading_min_angle: 0.35
      max_angular_accel: 2.5
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      # Global planning should remain anchored to the static warehouse map.
      # The rolling scan is motion-compensated for AMCL/local avoidance, but
      # using the same short-horizon scan as a global obstacle source can turn
      # transient observations into long detours during extended runs.
      # Sources:
      # - Nav2 costmap tuning: https://docs.nav2.org/tuning/index.html
      # - Nav2 obstacle layer: https://docs.nav2.org/configuration/packages/costmap-plugins/obstacle.html
      plugins: ["static_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.36, 0.0, 1.1]
    min_velocity: [-0.36, 0.0, -1.1]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    # OPEN_LOOP smoothing does not use odom feedback for control, but keeping
    # this topic consistent prevents silent /odom assumptions if feedback mode
    # or diagnostics are changed later.
    # Source: https://docs.nav2.org/configuration/packages/configuring-velocity-smoother.html
    odom_topic: "/chassis/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

lifecycle_manager_localization:
  ros__parameters:
    autostart: true
    node_names: ['map_server', 'amcl']
    bond_timeout: 30.0

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    node_names: ['controller_server', 'smoother_server', 'planner_server', 'behavior_server', 'bt_navigator', 'waypoint_follower', 'velocity_smoother']
    bond_timeout: 30.0
